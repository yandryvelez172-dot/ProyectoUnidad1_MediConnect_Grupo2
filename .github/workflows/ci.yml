name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validar sintaxis del código
        run: npm run check

      - name: Ejecutar pruebas automáticas
        run: npm test
